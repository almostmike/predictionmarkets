# Default gitleaks rules plus Polymarket US key assignments.
[extend]
useDefault = true

[[rules]]
id = "anthropic-token"
description = "Anthropic API key or Claude Code OAuth token"
regex = '''sk-ant-[A-Za-z0-9_-]{20,}'''
keywords = ["sk-ant-"]

[[rules]]
id = "quotient-key"
description = "Quotient API key assigned a value"
regex = '''QUOTIENT_API_KEY[ \t]*[=:][ \t]*["']?[A-Za-z0-9+/=_-]{8,}'''
keywords = ["quotient_api_key"]

[[rules]]
id = "polymarket-us-key"
description = "Polymarket US API key or secret assigned a value"
regex = '''POLYMARKET_(?:KEY_ID|SECRET_KEY)[ \t]*[=:][ \t]*["']?[A-Za-z0-9+/=_-]{8,}'''
keywords = ["polymarket_key_id", "polymarket_secret_key"]

# Gitignored paths never reach GitHub, so the working-tree scan skips them.
# .env holds the real keys; scanning it would block every push.
[[allowlists]]
description = "gitignored paths"
paths = ['''(^|/)node_modules/''', '''(^|/)\.env$''', '''(^|/)\.cache/''', '''(^|/)logs/''']
